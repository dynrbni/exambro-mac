<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Exambrowser Client</title>
  <link rel="stylesheet" href="launcher.css" />
</head>
<body>
  <div id="splash">
    <img id="splash-img" src="assets/kemdikbud2.jpg" alt="" aria-hidden="true" />
    <div id="splash-progress"><div id="splash-bar"></div></div>
  </div>

  <div id="app" class="hidden">
    <div id="menustrip">
      <button class="menu-item" id="mi-close" type="button">Close</button>
      <button class="menu-item" id="mi-settings" type="button">Settings</button>
      <span id="mi-about">26.0222 Bit64 REL &copy; 2015 PUSMENDIK</span>
    </div>

    <div id="main-content">
      <div id="gbox-title">DARING</div>
      
      <div id="rows"></div>
      
      <div id="camrow" class="row">
        <div class="icon"><img src="assets/webcam.png" alt="" /></div>
        <div class="row-content">
          <div class="lbl" id="cam-label">Webcam</div>
          <select id="cameraSelect"></select>
        </div>
        <div class="status"><img id="cam-status" src="assets/ceklis.png" alt="" /></div>
      </div>

      <div class="btn-wrap">
        <button id="btnMULAI" type="button">RUN</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <div id="modal" class="hidden">
    <div class="modal-box">
      <div class="modal-head" id="modal-title">Settings</div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <script src="launcher.js"></script>
</body>
</html>
